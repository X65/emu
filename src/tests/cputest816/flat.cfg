# ld65 config for the flat cpuemu build of gilyon's 65816 test suite.
#
# Upstream links this as a SNES LoROM cartridge, where each 32K segment maps to
# the upper half of a bank. cpuemu has a flat 16 MB address space instead, so
# the segments are packed contiguously into one image loaded at $8000.
#
# The generator splits the tests across five code segments because jsr is
# bank-local - a CPU constraint, not a LoROM one - keeping each under 32K. Two
# of them therefore fit in a 64K bank, as long as neither straddles a boundary:
#
#   CODE   $008000..$00FFFF   bank 0     BANK3  $020000..$027FFF   bank 2
#   BANK1  $010000..$017FFF   bank 1     BANK4  $028000..$02FFFF   bank 2
#   BANK2  $018000..$01FFFF   bank 1
#
# ld65 errors if a segment overflows its region, so that stays checked rather
# than assumed. The tests' own scratch areas - bank 0 pages 0-3, banks 6 and 7,
# and the $00FFA0 pointer - are all clear of the image.

MEMORY {
    ZEROPAGE:   start =      $0, size =  $100;
    BSS:        start =    $200, size = $1800;

    ROM:        start =  $8000, size = $8000, fill = yes, file = %O;
    BANK1:      start = $10000, size = $8000, fill = yes, file = %O;
    BANK2:      start = $18000, size = $8000, fill = yes, file = %O;
    BANK3:      start = $20000, size = $8000, fill = yes, file = %O;
    BANK4:      start = $28000, size = $8000, fill = yes, file = %O;
}

SEGMENTS {
    ZEROPAGE:   load = ZEROPAGE,    type = zp;
    BSS:        load = BSS,         type = bss, align = $100;

    CODE:       load = ROM,         align = $8000;
    RODATA:     load = ROM;
    TEST_DATA:  load = ROM,         start = $FFA0;
    VECTORS:    load = ROM,         start = $FFE0;

    BANK1:      load = BANK1,       align = $8000, optional = yes;
    BANK2:      load = BANK2,       align = $8000, optional = yes;
    BANK3:      load = BANK3,       align = $8000, optional = yes;
    BANK4:      load = BANK4,       align = $8000, optional = yes;
}
